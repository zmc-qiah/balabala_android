apply from: 'dependencies.gradle'
buildscript {
    ext.kotlin_version = '1.8.0'

    repositories {
        maven { url "$rootDir/localMavenRepository/snapshot" }
//        maven { url "$rootDir/autotrack_plugin/repo" }

        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()
        dependencies {
            classpath 'com.android.tools.build:gradle:7.0.3'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            classpath "org.jetbrains.kotlin:kotlin-android-extensions:$kotlin_version"
//            classpath "cn.sensorsdata.autotrack:plugin:1.0.0"

//            classpath "com.pengxr:toast:1.3.0"
            classpath 'org.jxxy.debug:TrackPlugin:1.0.0'
        }
    }

}
allprojects {
    configurations.all {
        resolutionStrategy {

        }
    }
    repositories {


        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()
        maven { url "$rootDir/localMavenRepository/snapshot" }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
